# show status bar at bottom for remote session,
# so it do not stack together with local session's one
set -g status-position bottom

# Set port of SSH remote tunnel, where tmux will pipe buffers to transfer on local machine for copy
set -g @copy_backend_remote_tunnel_port 11988

# In remote mode we don't show "clock" and "battery status" widgets
set -g status-left "$wg_session"
set -g status-right "#{prefix_highlight} $wg_is_keys_off $wg_is_zoomed #{sysstat_cpu} | #{sysstat_mem} | #{sysstat_loadavg} | $wg_user_host | #{online_status}"

# Pass the active pane's title out, so the local tmux sees an agent's task and the folder over ssh
set -g set-titles on
set -g set-titles-string '#{pane_title}'

# Draw no background of its own, so the Mac's theme shows through a pane that is on this server
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g status-style 'fg=colour245,bg=default'

# The Mac's tmux shows the windows and the sidebar shows the machine, so a status bar in every remote pane is noise
set -g status off
