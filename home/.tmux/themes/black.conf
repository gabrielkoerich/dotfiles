# Near black panes with an orange accent, the original look
set -g @theme black
set -g @thm_bg '#101010'
set -g @thm_bg_dim '#080808'
set -g @thm_fg default
set -g @thm_fg_dim '#9e9e9e'
set -g @thm_muted '#8a8a8a'
set -g @thm_surface '#303030'
set -g @thm_accent '#d75f00'
set -g @thm_purple '#af5fd7'
set -g @thm_blue '#00afff'
set -g @thm_green '#5fd700'
set -g @thm_yellow '#ffd700'
set -g @thm_red '#d70000'
set -g @thm_alert '#ff0000'
set -g @thm_border default
set -g @agents-fzf-colors 'bg:-1,bg+:236,fg:250,fg+:255,hl:173,hl+:173,pointer:173,prompt:173,info:240,header:240,gutter:-1'
