# Deep navy with a soft blue accent, after herdr's ink
set -g @theme ink
set -g @thm_bg '#131722'
set -g @thm_bg_dim '#0e111a'
set -g @thm_fg '#d8dee9'
set -g @thm_fg_dim '#9aa3b5'
set -g @thm_muted '#6e7686'
set -g @thm_surface '#222839'
set -g @thm_accent '#8aaee6'
set -g @thm_purple '#b9a3e3'
set -g @thm_blue '#8aaee6'
set -g @thm_green '#8cc7a8'
set -g @thm_yellow '#e3c27e'
set -g @thm_red '#e08787'
set -g @thm_alert '#e08787'
set -g @thm_border '#2a3142'
set -g @agents-fzf-colors 'bg:-1,bg+:#222839,fg:#d8dee9,fg+:#d8dee9,hl:#8aaee6,hl+:#8aaee6,pointer:#8aaee6,prompt:#8aaee6,info:#6e7686,header:#6e7686,gutter:-1'
set -g @thm_badges '#8aaee6 #b9a3e3 #8cc7a8 #e3c27e #e08787 #88c0d0 #d4a5c7'
