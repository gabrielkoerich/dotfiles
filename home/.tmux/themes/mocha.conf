# Catppuccin Mocha, the palette of the Zed theme
set -g @theme mocha
set -g @thm_bg '#1e1e2e'
set -g @thm_bg_dim '#181825'
set -g @thm_fg '#cdd6f4'
set -g @thm_fg_dim '#a6adc8'
set -g @thm_muted '#7f849c'
set -g @thm_surface '#313244'
set -g @thm_accent '#fab387'
set -g @thm_purple '#cba6f7'
set -g @thm_blue '#89b4fa'
set -g @thm_green '#a6e3a1'
set -g @thm_yellow '#f9e2af'
set -g @thm_red '#f38ba8'
set -g @thm_alert '#f38ba8'
set -g @thm_border '#45475a'
set -g @agents-fzf-colors 'bg:-1,bg+:#313244,fg:#cdd6f4,fg+:#cdd6f4,hl:#fab387,hl+:#fab387,pointer:#fab387,prompt:#fab387,info:#7f849c,header:#7f849c,gutter:-1'
set -g @thm_badges '#89b4fa #cba6f7 #a6e3a1 #fab387 #f38ba8 #f9e2af #94e2d5 #f5c2e7'
