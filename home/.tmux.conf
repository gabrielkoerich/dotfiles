# ==========================
# ===  General settings  ===
# ==========================

set -g default-terminal "screen-256color"
set -g history-limit 20000
set -g buffer-limit 20
set -sg escape-time 0
set -g display-time 1500
set -g remain-on-exit off
# Keep tmux server alive so long-lived sessions survive detached periods.
set -g exit-empty off
set -g repeat-time 300
setw -g allow-rename off
setw -g automatic-rename off
# setw -g aggressive-resize on
setw -g aggressive-resize off

# Change prefix key to C-a, easier to type, same to "screen"
unbind C-b
set -g prefix C-a

# Set parent terminal title to reflect current window in tmux session
# set -g set-titles on
# set -g set-titles-string "#I:#W"

# Enable terminal title setting
set -g set-titles on

# Send user@host and the session name (#S) up to Ghostty as the window title
set -g set-titles-string "#(whoami)@#H 👻 #S"

# set -g set-titles off
set-option -g status-interval 1
set-option -g automatic-rename on
# Windows name their active pane: an agent or its host and its task, host@user over ssh, the folder in a shell, else command and folder
set-option -g automatic-rename-format '#{?#{&&:#{m/r:^[^a-zA-Z0-9 ]+ ,#{pane_title}},#{||:#{@remote_session},#{!:#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}}}}},#{?#{@ssh_host},#{@ssh_host},#{pane_current_command}} › #{s|^[^a-zA-Z0-9 ]+ ||:pane_title},#{?#{||:#{m/r:^(ssh|mosh-client)$,#{pane_current_command}},#{@remote_session}},#{?#{@ssh_host},#{@ssh_host}#{?#{@ssh_user},@#{@ssh_user},},ssh},#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command} #{b:pane_current_path}}}}'

# Start index of window/pane with 1, because we're humans, not computers
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support
set -g mouse on

# Forward terminal focus in/out to panes, used by Claude Code and vim FocusGained
set -g focus-events on

# Mouse wheel: enter copy-mode and scroll when not in alt-screen / already in copy-mode
bind -T root WheelUpPane   if -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M" "copy-mode -e ; send-keys -X -N 2 scroll-up"
bind -T root WheelDownPane if -F "#{||:#{pane_in_mode},#{alternate_on}}" "send-keys -M" "send-keys -X -N 2 scroll-down"

# ==========================
# ===   Key bindings     ===
# ==========================

# Unbind default key bindings, we're going to override
unbind "\$" # rename-session
unbind ","    # rename-window
unbind %    # split-window -h
unbind '"'  # split-window
unbind "}"    # swap-pane -D
unbind "{"    # swap-pane -U
unbind "["    # paste-buffer
unbind "]"
unbind "'"  # select-window
unbind c    # new-window
unbind n    # next-window
unbind p    # previous-window
unbind l    # last-window
unbind M-n  # next window with alert
unbind M-p  # next window with alert
unbind o    # focus thru panes
unbind &    # kill-window
unbind "#"  # list-buffer
unbind =    # choose-buffer
unbind z    # zoom-pane
unbind M-Up  # resize 5 rows up
unbind M-Down # resize 5 rows down
unbind M-Right # resize 5 rows right
unbind M-Left # resize 5 rows left


# Edit configuration and reload
bind -N "Edit tmux.conf, then reload it" C-e new-window -n 'tmux.conf' "sh -c '\${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display \"Config reloaded\"'"

# Reload tmux configuration
bind -N "Reload tmux.conf" C-r source-file ~/.tmux.conf \; display "Config reloaded"

# A cheat sheet of every binding that has a note, read live from the server
bind -N "This cheat sheet" h display-popup -E -w 70% -h 85% -T " keys " "~/.tmux/keys | less -R"

# new window and retain cwd
bind -N "New window in this folder" n new-window -c "#{pane_current_path}"

# Prompt to rename window right after it's created

# Rename session and window
bind -N "Rename window" r command-prompt -I "#{window_name}" "rename-window '%%'"
bind -N "Rename session" R command-prompt -I "#{session_name}" "rename-session '%%'"

# Split panes
# In a pane on a server the new pane connects to that server too, through tmux-agents when it is installed
agents_split='s=~/.tmux/plugins/tmux-agents/scripts/split; if [ -x $s ]; then $s'
bind -N "Split side by side, on the server too over ssh" | run-shell "$agents_split h '#{pane_id}'; else tmux split-window -h -t '#{pane_id}' -c '#{pane_current_path}'; fi"
bind -N "Split top and bottom, on the server too over ssh" _ run-shell "$agents_split v '#{pane_id}'; else tmux split-window -v -t '#{pane_id}' -c '#{pane_current_path}'; fi"

# Select pane and windows
bind -N "Previous window" -r C-[ previous-window
bind -N "Next window" -r C-] next-window
bind -N "Tab 1: a session or a window, as the tabs show" 1 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 1p | cut -d" " -f2-)"' } { select-window -t :1 }
bind -N "Tab 2: a session or a window, as the tabs show" 2 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 2p | cut -d" " -f2-)"' } { select-window -t :2 }
bind -N "Tab 3: a session or a window, as the tabs show" 3 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 3p | cut -d" " -f2-)"' } { select-window -t :3 }
bind -N "Tab 4: a session or a window, as the tabs show" 4 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 4p | cut -d" " -f2-)"' } { select-window -t :4 }
bind -N "Tab 5: a session or a window, as the tabs show" 5 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 5p | cut -d" " -f2-)"' } { select-window -t :5 }
bind -N "Previous pane" -r [ select-pane -t :.-
bind -N "Next pane" -r ] select-pane -t :.+
bind -N "Last window" -r Tab last-window   # cycle thru MRU tabs

# Switch windows without prefix key
bind -N "Previous window" -n S-Left previous-window
bind -N "Next window" -n S-Right next-window
# Cmd+N is the Nth tab and Option+N the Nth sidebar item, sessions or windows as @agents-tabs says.
# Ghostty sends Cmd+N as ESC [ 900N ~, which tmux knows as User0 to User8
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
set -s user-keys[2] "\e[9003~"
set -s user-keys[3] "\e[9004~"
set -s user-keys[4] "\e[9005~"
set -s user-keys[5] "\e[9006~"
set -s user-keys[6] "\e[9007~"
set -s user-keys[7] "\e[9008~"
set -s user-keys[8] "\e[9009~"
bind -N "Cmd+1: tab 1, a session or a window" -n User0 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 1p | cut -d" " -f2-)"' } { select-window -t :1 }
bind -N "Cmd+2: tab 2, a session or a window" -n User1 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 2p | cut -d" " -f2-)"' } { select-window -t :2 }
bind -N "Cmd+3: tab 3, a session or a window" -n User2 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 3p | cut -d" " -f2-)"' } { select-window -t :3 }
bind -N "Cmd+4: tab 4, a session or a window" -n User3 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 4p | cut -d" " -f2-)"' } { select-window -t :4 }
bind -N "Cmd+5: tab 5, a session or a window" -n User4 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 5p | cut -d" " -f2-)"' } { select-window -t :5 }
bind -N "Cmd+6: tab 6, a session or a window" -n User5 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 6p | cut -d" " -f2-)"' } { select-window -t :6 }
bind -N "Cmd+7: tab 7, a session or a window" -n User6 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 7p | cut -d" " -f2-)"' } { select-window -t :7 }
bind -N "Cmd+8: tab 8, a session or a window" -n User7 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 8p | cut -d" " -f2-)"' } { select-window -t :8 }
bind -N "Cmd+9: tab 9, a session or a window" -n User8 if -F "#{==:#{@agents-tabs},sessions}" { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 9p | cut -d" " -f2-)"' } { select-window -t :9 }
bind -N "Option+1: sidebar item 1, a window or a session" -n M-1 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :1 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 1p | cut -d" " -f2-)"' }
bind -N "Option+2: sidebar item 2, a window or a session" -n M-2 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :2 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 2p | cut -d" " -f2-)"' }
bind -N "Option+3: sidebar item 3, a window or a session" -n M-3 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :3 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 3p | cut -d" " -f2-)"' }
bind -N "Option+4: sidebar item 4, a window or a session" -n M-4 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :4 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 4p | cut -d" " -f2-)"' }
bind -N "Option+5: sidebar item 5, a window or a session" -n M-5 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :5 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 5p | cut -d" " -f2-)"' }
bind -N "Option+6: sidebar item 6, a window or a session" -n M-6 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :6 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 6p | cut -d" " -f2-)"' }
bind -N "Option+7: sidebar item 7, a window or a session" -n M-7 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :7 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 7p | cut -d" " -f2-)"' }
bind -N "Option+8: sidebar item 8, a window or a session" -n M-8 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :8 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 8p | cut -d" " -f2-)"' }
bind -N "Option+9: sidebar item 9, a window or a session" -n M-9 if -F "#{==:#{@agents-tabs},sessions}" { select-window -t :9 } { run-shell 'tmux switch-client -t "$(tmux list-sessions -F "##{session_id} ##{session_name}" | sort -k1.2n | sed -n 9p | cut -d" " -f2-)"' }

bind -N "Swap panes" -r C-o swap-pane -D

# [MERGED] Navigate panes without prefix key using Alt+Arrow
bind -N "Pane to the left" -n M-Left select-pane -L
bind -N "Pane to the right" -n M-Right select-pane -R
bind -N "Pane above" -n M-Up select-pane -U
bind -N "Pane below" -n M-Down select-pane -D

# Zoom pane
bind -N "Zoom the pane in or out" + resize-pane -Z

# Link window
bind -N "Link a window from another session" L command-prompt -p "Link window from (session:window): " "link-window -s %% -a"

# Swap panes back and forth with 1st pane
# When in main-(horizontal|vertical) layouts, the biggest/widest panel is always @1
# bind \ if '[ #{pane_index} -eq 1 ]' \
#      'swap-pane -s "!"' \
#      'select-pane -t:.1 ; swap-pane -d -t 1 -s "!"'

# Kill pane/window/session shortcuts
bind -N "Close the pane" x kill-pane
bind -N "Close the window, asks first" w confirm-before -p "kill window #W? (y/n)" kill-window
bind -N "Close the window" X kill-window
bind -N "Close the other windows, asks first" C-x confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind -N "Close the session, asks first" Q confirm-before -p "kill-session #S? (y/n)" kill-session

# Merge session with another one (e.g. move all windows)
# If you use adhoc 1-window sessions, and you want to preserve session upon exit
# but don't want to create a lot of small unnamed 1-window sessions around
# move all windows from current session to main named one (dev, work, etc)
bind -N "Merge another session into this one" C-u command-prompt -p "Session to merge with: " \
   "run-shell 'yes | head -n #{session_windows} | xargs -I {} -n 1 tmux movew -t %%'"

# Detach from session
bind -N "Detach" d detach
bind -N "Detach the other terminals" D if -F '#{session_many_attached}' \
    'confirm-before -p "Detach other clients? (y/n)" "detach -a"' \
    'display "Session has only 1 client attached"'

# Hide status bar on demand
bind -N "Show or hide the status bar" C-s if -F '#{s/off//:status}' 'set status off' 'set status on'

# ==================================================
# === Window monitoring for activity and silence ===
# ==================================================
bind -N "Watch the window for activity, on or off" m setw monitor-activity \; display-message 'Monitor window activity [#{?monitor-activity,ON,OFF}]'
bind -N "Watch the window for silence" M if -F '#{monitor-silence}' \
    'setw monitor-silence 0 ; display-message "Monitor window silence [OFF]"' \
    'command-prompt -p "Monitor silence: interval (s)" "setw monitor-silence %%"'

# Activity shows as an orange window in the status bar, a message per event is too noisy
setw -g monitor-activity on
set -g visual-activity off

# tmux has no pane activity flag, so mark inactive panes on output and clear the mark on focus.
# The pane-activity hook is newer than the tmux some servers run (3.5a), so set it only where it exists
if-shell "tmux set-hook -g pane-activity '' 2>/dev/null" {
  set-hook -g pane-activity 'if -F "#{pane_active}" "" "set -p @activity 1"'
}
set-hook -g after-select-pane 'set -pu @activity'
set-hook -g pane-focus-in 'set -pu @activity'

# TODO: Does not work as well, check on newer versions
# set -g visual-silence on

# BUG: bell-action other ignored · Issue #1027 · tmux/tmux · GitHub - https://github.com/tmux/tmux/issues/1027
# set -g visual-bell on
# setw -g bell-action other

# ================================================
# ===     Copy mode, scroll and clipboard      ===
# ================================================
set -g @copy_use_osc52_fallback on

# [MERGED] Enable tmux's built-in OSC 52 clipboard integration with the terminal
set -g set-clipboard on
# [MERGED] Allow terminal passthrough sequences (needed for inline images in kitty/iTerm2, sixel, etc.)
set -g allow-passthrough all

# Prefer vi style key table
setw -g mode-keys vi

bind -N "Paste" p paste-buffer
bind -N "Choose what to paste" C-p choose-buffer

# trigger copy mode by (removed: conflicts with Alt+Up pane navigation, use mouse scroll instead)
# bind -n M-Up copy-mode

# Scroll up/down by 1 line, half screen, whole screen
bind -T copy-mode-vi M-Up              send-keys -X scroll-up
bind -T copy-mode-vi M-Down            send-keys -X scroll-down
bind -T copy-mode-vi M-PageUp          send-keys -X halfpage-up
bind -T copy-mode-vi M-PageDown        send-keys -X halfpage-down
bind -T copy-mode-vi PageDown          send-keys -X page-down
bind -T copy-mode-vi PageUp            send-keys -X page-up

# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane       select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane     select-pane \; send-keys -X -N 2 scroll-down

# wrap default shell in reattach-to-user-namespace if available
# there is some hack with `exec & reattach`, credits to "https://github.com/gpakosz/.tmux"
# don't really understand how it works, but at least window are not renamed to "reattach-to-user-namespace"
if -b "command -v reattach-to-user-namespace > /dev/null 2>&1" \
    "run 'tmux set -g default-command \"exec $(tmux show -gv default-shell) 2>/dev/null & reattach-to-user-namespace -l $(tmux show -gv default-shell)\"'"

yank="~/.tmux/yank.sh"

# Copy selected text
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "$yank"
bind -T copy-mode-vi Y send-keys -X copy-line \;\
    run "tmux save-buffer - | $yank"
bind-key -T copy-mode-vi D send-keys -X copy-end-of-line \;\
    run "tmux save-buffer - | $yank"
bind -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "$yank"
bind-key -T copy-mode-vi A send-keys -X append-selection-and-cancel \;\
    run "tmux save-buffer - | $yank"

# [MERGED] Replaced drag-to-copy behavior: was using yank.sh (supports remote/OSC52) and staying
# in copy mode; now uses pbcopy directly (local macOS only) and exits copy mode on drag end.
# To restore old behavior (e.g. for remote sessions), uncomment below and comment out the pbcopy lines.
# bind -T copy-mode-vi MouseDragEnd1Pane \
#     send-keys -X copy-pipe "$yank"
# bind -T copy-mode-vi MouseDown1Pane select-pane \;\
#    send-keys -X clear-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# iTerm2 works with clipboard out of the box, set-clipboard already set to "external"
# tmux show-options -g -s set-clipboard
# set-clipboard on|external

# =====================================
# ===           Theme               ===
# =====================================

# Colours come from the @thm_* options a theme in ~/.tmux/themes sets, so `~/.tmux/theme <name>` repaints everything live
source-file ~/.tmux/themes/black.conf
run '~/.tmux/theme "$(~/.tmux/theme)"'
bind -N "Colour theme menu" C-t display-menu -T "#[align=centre]theme" Black b "run '~/.tmux/theme black'" Mocha m "run '~/.tmux/theme mocha'" Ink i "run '~/.tmux/theme ink'"

color_orange="#{@thm_accent}"
color_purple="#{@thm_purple}"
color_green="#{@thm_green}"
color_blue="#{@thm_blue}"
color_yellow="#{@thm_yellow}"
color_red="#{@thm_red}"
color_black="#{@thm_bg_dim}"
color_white="#{@thm_fg}"

# This is a theme CONTRACT, you are required to define variables below
# Change values, but not remove/rename variables itself
color_dark="$color_black"
color_light="$color_white"
color_session_text="$color_blue"
color_status_text="#{@thm_muted}"
color_main="$color_orange"
color_secondary="$color_purple"
color_level_ok="$color_green"
color_level_warn="$color_yellow"
color_level_stress="$color_red"
color_window_off_indicator="colour088"
color_window_off_status_bg="#{@thm_surface}"
color_window_off_status_current_bg="colour254"

# =====================================
# ===    Appearence and status bar  ===
# ======================================

set -g mode-style "fg=default,bg=$color_main"

# command line style
set -g message-style "fg=$color_main,bg=$color_dark"

# status line style
set -g status-style "fg=$color_status_text,bg=$color_dark"

# window segments in status line

# setw -g window-status-style "fg=$color_status_text,bg=$color_dark"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=$color_light,bold,bg=$color_main"
setw -g window-status-current-format " #I:#W "

# when window has monitoring notification
setw -g window-status-activity-style "fg=$color_main"

# Inactive panes are dimmer than the active one
set -g window-style 'fg=#{@thm_fg_dim},bg=#{@thm_bg_dim}'
set -g window-active-style 'fg=#{@thm_fg},bg=#{@thm_bg}'
set -g popup-style 'fg=#{@thm_fg},bg=#{@thm_bg}'
set -g popup-border-style 'fg=#{@thm_border},bg=#{@thm_bg}'
set -g menu-style 'fg=#{@thm_fg},bg=#{@thm_bg}'
set -g menu-selected-style 'fg=#{@thm_fg},bg=#{@thm_surface}'
set -g menu-border-style 'fg=#{@thm_border},bg=#{@thm_bg}'

# Inactive pane border color (disabled — uncomment for dark grey inactive borders)
# set -g pane-border-style "fg=colour238 bg=default"
# outline for active pane
# Panes running ssh get a red border and badge, so a remote shell is plain on this screen
is_ssh="#{||:#{m/r:^(ssh|mosh-client)$,#{pane_current_command}},#{@remote_session}}"
setw -g pane-active-border-style "#{?$is_ssh,fg=#{@thm_alert},fg=$color_main},bg=#{@thm_bg_dim}"
setw -g pane-border-style "#{?$is_ssh,fg=#{@thm_alert},fg=#{@thm_border}},bg=#{@thm_bg_dim}"
# [MERGED] Show pane number and running command as labels on pane borders
# The agents sidebar gets a plain label, its number and folder say nothing
set -g pane-border-format '#{?@agent_sidebar,#[fg=#{@thm_muted}] agents ,#{?'"$is_ssh"',#[fg=colour231#,bg=#{@thm_alert}#,bold] SSH #[default] ,}#{?@activity,#[fg='"$color_main"'#,bold],#[bold]}#P #[default]#[fg=#{@thm_fg_dim}]#{?pane_title,#{pane_title},#{pane_current_command}} #[fg=#{@thm_purple}]@#[fg=#{@thm_muted}] #{s|'"$HOME"'|~|:pane_current_path}#[default] }'
set -g pane-border-status top

# general status bar settings
set -g status on
set -g status-interval 5

set -g status-position top
set -g status-left-length 100
set -g status-right-length 130

# online and offline icon for tmux-online-status
set -g @online_icon "#[fg=$color_level_ok]●#[default]"
set -g @offline_icon "#[fg=$color_level_stress]●#[default]"

# Configure view templates for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_mem_view_tmpl 'MEM:#[fg=#{mem.color}]#{mem.pused}#[default] #{mem.used}'

# Configure colors for tmux-plugin-sysstat "MEM" and "CPU" widget
set -g @sysstat_cpu_color_low "$color_level_ok"
set -g @sysstat_cpu_color_medium "$color_level_warn"
set -g @sysstat_cpu_color_stress "$color_level_stress"

set -g @sysstat_mem_color_low "$color_level_ok"
set -g @sysstat_mem_color_medium "$color_level_warn"
set -g @sysstat_mem_color_stress "$color_level_stress"

set -g @sysstat_swap_color_low "$color_level_ok"
set -g @sysstat_swap_color_medium "$color_level_warn"
set -g @sysstat_swap_color_stress "$color_level_stress"

# Configure tmux-battery widget colors
set -g @batt_color_full_charge "#[fg=$color_level_ok]"
set -g @batt_color_high_charge "#[fg=$color_level_ok]"
set -g @batt_color_medium_charge "#[fg=$color_level_warn]"
set -g @batt_color_low_charge "#[fg=$color_level_stress]"

# Configure tmux-prefix-highlight colors
set -g @prefix_highlight_output_prefix '['
set -g @prefix_highlight_output_suffix ']'
set -g @prefix_highlight_fg "$color_dark"
set -g @prefix_highlight_bg "$color_secondary"
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr "fg=$color_dark,bg=$color_secondary"


# =====================================
# ===        Renew environment      ===
# =====================================
set -g update-environment \
  "DISPLAY\
  SSH_ASKPASS\
  SSH_AUTH_SOCK\
  SSH_AGENT_PID\
  SSH_CONNECTION\
  SSH_TTY\
  WINDOWID\
  XAUTHORITY"

# [MERGED] OSC 52 clipboard support — lets tmux set the system clipboard via terminal escape sequences
set -ga terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\007'
# [MERGED] Cursor shape: block in normal mode, bar in insert mode (for vim/nvim in tmux)
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
# https://dandavison.github.io/delta/tips-and-tricks/using-delta-with-tmux.html
set -ga terminal-overrides ",*-256color:Tc"

# Pass OSC 8 hyperlinks through to Ghostty, so Cmd+click opens them
set -as terminal-features ",xterm-ghostty:hyperlinks"

# [MERGED] Pass TERM_PROGRAM env var so apps inside tmux can detect the host terminal
set -ga update-environment "TERM_PROGRAM"

bind -N "Reload the environment in every shell" '$' run "~/.tmux/renew.sh"

# =====================================
# ===      Session persistence      ===
# =====================================
# Manual save/restore (resurrect plugin)
bind -N "Save sessions (resurrect)" S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "Session saved"
bind -N "Restore saved sessions (resurrect)" T run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' \; display-message "Session restored"

# Continuum auto-save + restore on tmux start
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# ============================
# ===       Plugins        ===
# ============================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'Rizhiy/tmux-vpn-status'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'samoshkin/tmux-plugin-sysstat'
set -g @plugin 'aaronpowell/tmux-weather'
set -g @plugin 'gabrielkoerich/tmux-agents'
# Machines the agents sidebar always lists, connected or not
set -g @agents-hosts 'm1-max legion vps-us vps-br'
# orch runs each task as claude -p in its own session
set -g @agents-headless-sessions 'orch-*'
# hermes runs as a service on vps-us, so the watcher polls its state over ssh
set -g @agents-services 'vps-us:hermes'
set -g @agents-services-interval 60
# Tabs on top: windows of the session, or sessions, with the sidebar listing the other one.
# Sessions, windows and the number keys all go by index
set -g @agents-tabs sessions
# The sidebar lists every window, and the panes of a split window, under this computer
set -g @agents-sidebar-panes on
# The picker reads these when it opens, so it follows the theme
set -g @agents-popup-style 'bg=#{@thm_bg}'
set -g @agents-popup-border-style 'fg=#{@thm_border},bg=#{@thm_bg}'

# Plugin properties
# c    Weather condition,
# C    Weather condition textual name,
# x    Weather condition, plain-text symbol,
# h    Humidity,
# t    Temperature (Actual),
# f    Temperature (Feels Like),
# w    Wind,
# l    Location,
# m    Moon phase,
# M    Moon day,
# p    Precipitation (mm/3 hours),
# P    Pressure (hPa),
# u    UV index (1-12),
set -g @forecast-format '%f'
set -g @forecast-location Florianopolis
# Without a cache the plugin runs curl on every status refresh
set -g @forecast-cache-duration 900

set -g @sidebar-tree 't'
set -g @sidebar-tree-focus 'T'
set -g @sidebar-tree-command 'tree -C'

set -g @open-S 'https://www.duckduckgo.com/?q='

# ==============================================
# ===   Widgets and status bar                   ===
# ==============================================

# define widgets we're going to use in status bar
# note, that this is not the complete list, some of them are loaded from plugins
wg_battery="#{battery_status_fg} #{battery_icon} #{battery_percentage}"
wg_date="#[fg=$color_secondary]%h %d %H:%M#[default]"
wg_user_host="#[fg=$color_secondary]#(whoami)#[default]@#H"
wg_is_zoomed="#[fg=$color_dark,bg=$color_secondary]#{?window_zoomed_flag,[Z],}#[default]"
# Set by the tmux-agents plugin: ! blocked on a prompt, ? asking a question, a dot when a turn finished out of view
wg_agent="#{?#{==:#{@agent_alert},blocked},#[fg=#{@thm_alert}#,bold] !#[default],}#{?#{==:#{@agent_alert},asking},#[fg=#{@thm_blue}#,bold] ?#[default],}#{?#{==:#{@agent_alert},done},#[fg=#{@thm_green}] ●#[default],}"
# The same marks for a whole session, which the tmux-agents watcher rolls up from its windows
wg_session_agent="#{?#{==:#{@agent_session_alert},blocked},#[fg=#{@thm_alert}#,bold] !#[default],}#{?#{==:#{@agent_session_alert},asking},#[fg=#{@thm_blue}#,bold] ?#[default],}#{?#{==:#{@agent_session_alert},done},#[fg=#{@thm_green}] ●#[default],}"
# TODO: highlighted for nested local session as well
wg_is_keys_off="#[fg=$color_light,bg=$color_window_off_indicator]#([ $(tmux show-option -qv key-table) = 'off' ] && echo 'OFF')#[default]"

set -g status-left " #[fg=$color_session_text]#S $wg_user_host "
# The stats, date, weather, battery, VPN and online status come from one script that keeps running, see
# ~/.tmux/stats.sh. As separate jobs, re-run every few seconds, some drew empty for a frame and the bar flickered
set -g status-right " #{prefix_highlight} $wg_is_keys_off $wg_is_zoomed #(~/.tmux/stats.sh)"
# Centre carries the sentence being spoken, sized to what left and right leave
set -g status-format[0] "#{E:status-left}#{?#{==:#{@agents-tabs},sessions},#{S/i:#[range=session|#{session_id}]$wg_session_agent#[fg=$color_status_text] #{session_name} #[norange default],#[range=session|#{session_id}]$wg_session_agent#[fg=$color_light#,bold] #[underscore#,us=$color_main]#{session_name}#[nounderscore] #[norange default]},#{W:#[range=window|#{window_index}]$wg_agent#{?#{||:#{window_activity_flag},#{window_silence_flag}},#[fg=$color_main#,bold],#[fg=$color_status_text]} #I:#W #[norange default],#[range=window|#{window_index}]$wg_agent#[fg=$color_light#,bold] #[underscore#,us=$color_main]#I:#W#[nounderscore] #[norange default]}}#[default]#[align=centre]#(~/.claude/hooks/voice-reply.sh now #{e|-:#{client_width},190})#[align=right]#{E:status-right}"

# Speaker pauses, spoken text jumps to its pane
# Only run-shell expands formats, if-shell command arguments do not
bind -n MouseDown1Status if -F "#{m:claude*,#{mouse_status_range}}" "run-shell -b '~/.claude/hooks/voice-reply.sh click #{mouse_status_range}'" "if -F '#{==:#{@agents-tabs},sessions}' 'switch-client -t=' 'select-window -t='"

# ==============================================
# ===   Nesting local and remote sessions     ===
# ==============================================

# Session is considered to be remote when we ssh into host
if-shell 'test -n "$SSH_CLIENT"' \
    'source-file ~/.tmux/tmux.remote.conf'

# We want to have single prefix key "C-a", usable both for local and remote session
# we don't want to "C-a" + "a" approach either
# Idea is to turn off all key bindings and prefix handling on local session,
# so that all keystrokes are passed to inner/remote session

# see: toggle on/off all keybindings · Issue #237 · tmux/tmux - https://github.com/tmux/tmux/issues/237

# Also, change some visual styles when window keys are off
bind -N "Nested tmux: send keys to the inner one, F12 again to come back" -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=$color_status_text,bg=$color_window_off_status_bg" \;\
    set window-status-current-format " #I:#W " \;\
    set window-status-current-style "fg=$color_dark,bold,bg=$color_window_off_status_current_bg" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\

bind -N "Back to this tmux after F12" -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-current-format \;\
  refresh-client -S

# Run all plugins' scripts
run '~/.tmux/plugins/tpm/tpm'

# prefix+t: a pane on a server gets the tree of its folder there, a local pane keeps tmux-sidebar's
bind -N "File tree, of the server over ssh" t if -F "#{||:#{m/r:^(ssh|mosh-client)$,#{pane_current_command}},#{@remote_session}}" {
  run-shell "~/.tmux/plugins/tmux-agents/scripts/tree '#{pane_id}'"
} {
  run-shell "~/.tmux/plugins/tmux-sidebar/scripts/toggle.sh 'tree -C | sh -c \"LESS= less --dumb --chop-long-lines --tilde --IGNORE-CASE --RAW-CONTROL-CHARS\",left,40' '#{pane_id}'"
}

# Claude spoken replies: click the speaker in the status bar, or M-v
set -g status-left-length 150
set -ga status-left "#[range=user|claudevoice] #(~/.claude/hooks/voice-reply.sh icon)#[norange] "
bind-key -N "Spoken replies on or off" -n M-v run-shell -b "~/.claude/hooks/voice-reply.sh toggle"

